      <div>

        Select the correct option for each question. Answers will be evaluated once you click <strong>Check Answers</strong> at the bottom.
      </div>
    </div>

    <!-- Questions Form -->
    <form id="quiz-form" onsubmit="event.preventDefault();" class="space-y-6">
      <div id="questions-list" class="space-y-6">
        <!-- Questions render dynamically -->
      </div>

      <!-- Action Buttons -->
      <div class="pt-6 flex flex-col sm:flex-row items-center justify-between gap-4">
        <button type="button" id="check-btn" onclick="checkAnswers()" class="w-full sm:w-auto px-8 py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/25 transition-all duration-200 flex items-center justify-center gap-2 active:scale-95">
          <i class="fa-solid fa-circle-check"></i>
          Check Answers

        <button type="button" onclick="resetQuiz()" class="w-full sm:w-auto px-6 py-3.5 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-medium rounded-xl transition-all duration-200 flex items-center justify-center gap-2">

    </form>

        ],

      },
      {

        prompt: "She spends a lot of time ______ videos to improve her pronunciation.",
        options: [
          { key: "A", text: "watch" },
          { key: "B", text: "to watch" },
          { key: "C", text: "watching" },
          { key: "D", text: "watched" }
        ],
        key: "C"
      },
      {
        id: 30,
        prompt: "______ in front of a large audience makes some people nervous.",
        options: [
          { key: "A", text: "Speak" },
          { key: "B", text: "Speaking" },
          { key: "C", text: "To speaking" },
          { key: "D", text: "Spoke" }
        ],
        key: "B"

    let currentQuestions = [];

    // Shuffle Utility
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Theme Switcher Logic
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');

    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      themeIcon.className = isDark ? 'fa-solid fa-sun text-amber-400 text-lg' : 'fa-solid fa-moon text-lg';
    });

    // Render Quiz Questions
    function renderQuiz() {
      currentQuestions = shuffleArray(rawQuestions);
      const container = document.getElementById('questions-list');
      container.innerHTML = '';

      currentQuestions.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'p-5 md:p-6 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm hover:shadow-md transition-shadow';
        card.id = `q-card-${qIndex}`;

        let optionsHTML = '';
        q.options.forEach(opt => {
          const inputId = `q_${qIndex}_opt_${opt.key}`;
          const inputName = `question_${qIndex}`;

          optionsHTML += `
            <label for="${inputId}" id="label_${inputId}" class="option-label flex items-start gap-3 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-750 cursor-pointer transition-colors">
              <input type="radio" 
                     id="${inputId}" 
                     name="${inputName}" 
                     value="${opt.key}" 
                     class="mt-1 w-4 h-4 text-brand-600 border-slate-300 focus:ring-brand-500 dark:border-slate-600 dark:bg-slate-700">
              <span class="text-slate-700 dark:text-slate-200 text-sm md:text-base leading-relaxed">
                <strong class="font-semibold mr-1">${opt.key})</strong> ${opt.text}
              </span>
            </label>
          `;
        });

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3 mb-3">
            <div class="flex items-center gap-2">
              <span class="w-7 h-7 bg-brand-100 dark:bg-slate-700 text-brand-700 dark:text-brand-300 rounded-lg text-sm font-bold flex items-center justify-center">
                ${qIndex + 1}
              </span>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300">
                Single Choice
              </span>
            </div>
            <div id="q-status-${qIndex}" class="hidden text-sm font-semibold flex items-center gap-1.5"></div>
          </div>
          <p class="text-slate-800 dark:text-slate-100 font-medium text-base md:text-lg mb-4">
            ${q.prompt}
          </p>
          <div class="space-y-2.5">
            ${optionsHTML}
          </div>
          <div id="q-explanation-${qIndex}" class="hidden mt-4 p-3 bg-slate-100 dark:bg-slate-750 rounded-xl text-xs md:text-sm text-slate-600 dark:text-slate-300"></div>
        `;

        container.appendChild(card);
      });
    }

    // Check Answers Logic
    function checkAnswers() {
      let score = 0;

      currentQuestions.forEach((q, qIndex) => {
        const inputName = `question_${qIndex}`;
        const selectedInput = document.querySelector(`input[name="${inputName}"]:checked`);
        const selectedKey = selectedInput ? selectedInput.value : null;

        const isCorrect = selectedKey === q.key;

        if (isCorrect) {
          score++;
        }

        // Status Badge Updating
        const statusEl = document.getElementById(`q-status-${qIndex}`);
        statusEl.classList.remove('hidden', 'text-emerald-600', 'text-red-500', 'dark:text-emerald-400', 'dark:text-red-400');

        if (isCorrect) {
          statusEl.className = 'text-sm font-semibold flex items-center gap-1 text-emerald-600 dark:text-emerald-400';
          statusEl.innerHTML = '<i class="fa-solid fa-circle-check"></i> Correct';
        } else {
          statusEl.className = 'text-sm font-semibold flex items-center gap-1 text-red-500 dark:text-red-400';
          statusEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Incorrect';
        }

        // Option styling and highlight
        q.options.forEach(opt => {
          const inputId = `q_${qIndex}_opt_${opt.key}`;
          const inputEl = document.getElementById(inputId);
          const labelEl = document.getElementById(`label_${inputId}`);
          if (!labelEl) return;

          // Disable inputs after checking
          if (inputEl) inputEl.disabled = true;
          labelEl.classList.add('cursor-not-allowed', 'opacity-90');

          labelEl.classList.remove('bg-emerald-50', 'border-emerald-500', 'dark:bg-emerald-950/40', 'bg-red-50', 'border-red-500', 'dark:bg-red-950/40');

          const isCorrectOption = opt.key === q.key;
          const isSelectedOption = opt.key === selectedKey;

          if (isCorrectOption) {
            labelEl.classList.add('bg-emerald-50', 'border-emerald-500', 'dark:bg-emerald-950/40');
          } else if (isSelectedOption) {
            labelEl.classList.add('bg-red-50', 'border-red-500', 'dark:bg-red-950/40');
          }
        });

        // Explanation text for missed or incorrect questions
        const explanationEl = document.getElementById(`q-explanation-${qIndex}`);
        const correctOpt = q.options.find(o => o.key === q.key);
        if (!isCorrect) {
          explanationEl.classList.remove('hidden');
          explanationEl.innerHTML = `<span class="font-semibold text-slate-700 dark:text-slate-200">Correct Answer:</span> <strong class="text-emerald-600 dark:text-emerald-400">${q.key}) ${correctOpt.text}</strong>`;
        } else {
          explanationEl.classList.add('hidden');
        }
      });

      displayResults(score);
    }

    // Display Results with exact 31-tier praise scale
    function displayResults(score) {
      const total = currentQuestions.length; // 30
      const fullText = praiseScaleExact[score] || "👍 Good effort!";
      
      const spaceIndex = fullText.indexOf(' ');
      const emoji = fullText.substring(0, spaceIndex);
      const textPhrase = fullText.substring(spaceIndex + 1);

      const resultCard = document.getElementById('result-card');
      document.getElementById('praise-emoji').textContent = emoji;
      document.getElementById('praise-text').textContent = textPhrase;
      
      const percentage = Math.round((score / total) * 100);
      document.getElementById('score-text').textContent = `You scored ${score} out of ${total} (${percentage}%)`;

      const scoreBar = document.getElementById('score-bar');
      resultCard.classList.remove('hidden');

      setTimeout(() => {
        scoreBar.style.width = `${percentage}%`;
      }, 100);

      resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function resetQuiz() {
      document.getElementById('result-card').classList.add('hidden');
      document.getElementById('score-bar').style.width = '0%';
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = function() {
      renderQuiz();
    };
